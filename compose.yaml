name: telemetryx

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telemetryx}
      POSTGRES_USER: ${POSTGRES_USER:-telemetryx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemetryx_local_only}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    command: uv run fastapi dev app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://telemetryx:telemetryx_local_only@db:5432/telemetryx
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: redis
    ports: ["8000:8000"]
    volumes: ["./backend:/app", "./data:/data", "./models:/models"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    build: { context: ., dockerfile: infra/docker/backend.Dockerfile }
    command: uv run dramatiq app.workers.tasks --processes 1 --threads 1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://telemetryx:telemetryx_local_only@db:5432/telemetryx
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: redis
    volumes: ["./backend:/app", "./data:/data", "./models:/models"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    command: pnpm dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      TELEMETRYX_API_URL: http://api:8000
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "frontend_node_modules:/app/node_modules"]
    depends_on: [api]

volumes:
  postgres_data:
  frontend_node_modules:
