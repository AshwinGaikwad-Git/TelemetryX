[project]
name = "telemetryx-backend"
version = "0.1.0"
description = "TelemetryX API and background worker foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2.0",
  "dramatiq[redis]>=1.17,<2.0",
  "fastapi[standard]>=0.115,<1.0",
  "joblib>=1.6.0",
  "numpy>=2.5.3",
  "pandas>=3.0.6",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.6,<3.0",
  "python-json-logger>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "scikit-learn>=1.9.1",
  "shap>=0.52.0",
  "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0", "mypy>=1.13,<2.0", "pytest>=8.3,<9.0", "pytest-cov>=6.0,<7.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]


[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "shap.*", "joblib.*"]
ignore_missing_imports = true

